services:
  - type: web
    name: campus-agent-simulation
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/init_campus_safe.py && python scripts/prepare_legacy_schema.py && python scripts/migrate_db.py && python scripts/seed_spatial_foundation.py && python scripts/seed_economy_foundation.py && python scripts/seed_organization_runtime.py && python scripts/seed_supply_foundation.py && python scripts/seed_labor_runtime.py && python scripts/seed_budget_runtime.py && python scripts/seed_market_runtime.py && python scripts/seed_credit_runtime.py && python scripts/seed_public_policy_runtime.py && python scripts/seed_social_institution_runtime.py && python scripts/seed_macro_runtime.py && python scripts/seed_adaptation_runtime.py && python scripts/seed_resilience_runtime.py && python scripts/seed_population_runtime.py && python scripts/seed_external_world.py && python scripts/seed_longitudinal_runtime.py && python scripts/audit_economy_ledger.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_URL
        sync: false
